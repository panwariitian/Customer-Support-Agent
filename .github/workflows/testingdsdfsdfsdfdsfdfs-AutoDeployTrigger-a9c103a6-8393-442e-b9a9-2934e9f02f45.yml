name: Trigger auto deployment for testingdsdfsdfsdfdsfdfs

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/testingdsdfsdfsdfdsfdfs-AutoDeployTrigger-a9c103a6-8393-442e-b9a9-2934e9f02f45.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TESTINGDSDFSDFSDFDSFDFS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TESTINGDSDFSDFSDFDSFDFS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TESTINGDSDFSDFSDFDSFDFS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/session3-api/DockerFile
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ca5172a1cc51acr.azurecr.io
          registryUsername: ${{ secrets.TESTINGDSDFSDFSDFDSFDFS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TESTINGDSDFSDFSDFDSFDFS_REGISTRY_PASSWORD }}
          containerAppName: testingdsdfsdfsdfdsfdfs
          resourceGroup: fb
          imageToBuild: ca5172a1cc51acr.azurecr.io/testingdsdfsdfsdfdsfdfs:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


